name: build-payload
# jruby feedstock: image (once, UNIVERSAL) → pair (per triplet) → (on
# tags) publish. spec 33's runtime-on-runtime form: the env image is the
# jruby home (bytecode + every platform's jffi stub — ONE universal
# asset), composed ON the published temurin java owner at dispatch.
#
# kind: runtime (spec 28/29/33): the image job ships the universal .tfs
# (+ sidecar + the release-tier manifest); each pair leg ships the
# wrapper exe (tebako-runtime-launcher, byte-identical to
# tamatebako/tebako's own asset) + sidecar + the per-triplet release
# shard (image.filename = the universal asset — entry_asset_names flows
# it verbatim, no product change). The pair legs' smokes: the spec 33 §5
# standalone fail-closed gate (exit 65) + the COMPOSED wire (shim → jruby
# → temurin owner) + the cext negative cell (a native-abi payload fails
# by name at dispatch — the shard's abi:"none" sentinel). The publish job uploads all of it, derives the monoliths
# (manifest.json + SHA256SUMS.txt, trr#140) from the shards + sidecars,
# renders the registry entry from manifests/registry.yaml, and lands it
# by bot PR. The bot PR rides the CI PAT (tebako#686): a
# GITHUB_TOKEN-authored PR never triggers pull_request workflows, so
# its checks would pend forever and auto-merge never fire — and the
# legs below skip the bot PR's registry-only file set.
# `tebako publish` is NOT used: the CLI refuses kind: runtime.
#
# PIN DISCIPLINE (the owner's rule): this workflow carries NO version or
# digest literals. Tebakofile is the SSOT — the `tools:` block pins the
# tfs CLI + tebako-shim (release + per-platform sha256, cross-checked
# against the release's own SHA256SUMS), the `runtime:` block pins the
# wrapper's product line, flavors.jvm.owner_smoke pins the published
# temurin pair (two-anchor verified at fetch); tools/pins.rb reads them
# into $GITHUB_ENV.
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Registry-only detection (tebako#686): the tag run's publish job
  # lands tpkg-registry.yaml by bot PR, and such a PR's whole change
  # set is that one file. The decision rides the FILES, never the
  # publish/* branch-name convention: the image/pair legs skip exactly
  # this file set; every other PR — and every non-PR event, where this
  # job never runs — builds unchanged.
  changes:
    name: registry-only change detection
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      registry_only: ${{ steps.detect.outputs.registry_only }}
    steps:
      - name: Detect the registry-only file set
        id: detect
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files="$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --json files --jq '[.files[].path] | sort | join(",")')"
          echo "changed files: $files"
          if [ "$files" = "tpkg-registry.yaml" ]; then
            echo "registry_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "registry_only=false" >> "$GITHUB_OUTPUT"
          fi
  image:
    # The UNIVERSAL env image, built once (the dist has no per-platform
    # variants; mkimage is not byte-reproducible across legs — the
    # created timestamp — so ONE leg's image is THE published asset).
    name: image / universal
    needs: changes
    # tebako#686: a registry-only bot PR skips the legs (its change set
    # is exactly tpkg-registry.yaml). A skipped changes job — every
    # non-PR event — never suppresses the legs, and neither does a
    # detection failure (a missing output reads as "not registry-only":
    # the safe default is to build).
    if: github.event_name != 'pull_request' || needs.changes.outputs.registry_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the toolchain pins (Tebakofile is the SSOT)
        shell: bash
        run: ruby tools/pins.rb linux-gnu-x86_64 jvm --env >> "$GITHUB_ENV"
      - name: Fetch the imager (pinned by Tebakofile, sha256-verified)
        shell: bash
        env:
          TFS_BIN: .packager/tfs
        run: |
          set -euo pipefail
          mkdir -p .packager
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sL --fail -o "$TFS_BIN" "$base/$TFS_ASSET"
          curl -sL --fail -o SHA256SUMS "$base/SHA256SUMS"
          echo "$TFS_SHA256  $TFS_BIN" | sha256sum -c -
          # The pin must agree with the release's own sums (both anchored).
          got=$(awk -v a="$TFS_ASSET" '$2 == a {print $1}' SHA256SUMS)
          [ "$got" = "$TFS_SHA256" ] || { echo "::error::pin mismatch for $TFS_ASSET: Tebakofile=$TFS_SHA256 release=${got:-ABSENT}"; exit 1; }
          chmod +x "$TFS_BIN"
          "$TFS_BIN" > /dev/null
      - name: Build the universal env image
        shell: bash
        env:
          ROLE: image
          TFS_CLI: .packager/tfs
        run: tools/build
      - name: Upload the image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-universal
          path: out/image/
          retention-days: 7

  pair:
    # Per triplet: the wrapper exe + sidecar + the per-triplet shard, and
    # the smokes against THIS platform's published temurin owner.
    name: pair / ${{ matrix.platform.triplet }}
    needs: [changes, image]
    # tebako#686: same registry-only skip as the image leg; the
    # needs.image.result arm keeps today's implicit "the image
    # succeeded" dependency exact under an explicit if.
    if: needs.image.result == 'success' && (github.event_name != 'pull_request' || needs.changes.outputs.registry_only != 'true')
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        # Identity only. The matrix MIRRORS Tebakofile's
        # flavors.jvm.platforms coverage (the recipe is the SSOT; the
        # registry rows name the same list). windows-ucrt64 is a named
        # follow-up (the universal image already serves it).
        platform:
          - triplet: aarch64-macos
            asset_platform: macos-arm64
            os: macos-14
          - triplet: x86_64-linux-gnu
            asset_platform: linux-gnu-x86_64
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the toolchain pins (Tebakofile is the SSOT)
        shell: bash
        run: ruby tools/pins.rb "${{ matrix.platform.asset_platform }}" jvm --env >> "$GITHUB_ENV"
      - name: Fetch the imager (pinned by Tebakofile, sha256-verified)
        shell: bash
        env:
          TFS_BIN: .packager/tfs
        run: |
          set -euo pipefail
          mkdir -p .packager
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sL --fail -o "$TFS_BIN" "$base/$TFS_ASSET"
          curl -sL --fail -o SHA256SUMS "$base/SHA256SUMS"
          echo "$TFS_SHA256  $TFS_BIN" | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
          got=$(awk -v a="$TFS_ASSET" '$2 == a {print $1}' SHA256SUMS)
          [ "$got" = "$TFS_SHA256" ] || { echo "::error::pin mismatch for $TFS_ASSET: Tebakofile=$TFS_SHA256 release=${got:-ABSENT}"; exit 1; }
          chmod +x "$TFS_BIN"
          "$TFS_BIN" > /dev/null
      - name: Fetch the wrapper (pinned by Tebakofile)
        shell: bash
        env:
          WRAPPER_BIN: .packager/tebako-runtime-launcher
        run: |
          set -euo pipefail
          mkdir -p .packager
          base="https://github.com/tamatebako/tebako/releases/download/$WRAPPER_RELEASE"
          curl -sL --fail -o "$WRAPPER_BIN" "$base/$WRAPPER_ASSET"
          echo "$WRAPPER_SHA256  $WRAPPER_BIN" | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
          chmod +x "$WRAPPER_BIN"
          echo "WRAPPER_BIN=$PWD/.packager/tebako-runtime-launcher" >> "$GITHUB_ENV"
      # The dispatcher for the composed smoke (spec 33's real wire: shim
      # → dep runtime → owner runtime). Same two-anchor rule as the
      # imager.
      - name: Fetch the dispatcher (tebako-shim, pinned by Tebakofile)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .packager
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sL --fail -o .packager/tebako-shim "$base/$TEBAKO_SHIM_ASSET"
          curl -sL --fail -o SHA256SUMS "$base/SHA256SUMS"
          echo "$TEBAKO_SHIM_SHA256  .packager/tebako-shim" | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
          got=$(awk -v a="$TEBAKO_SHIM_ASSET" '$2 == a {print $1}' SHA256SUMS)
          [ "$got" = "$TEBAKO_SHIM_SHA256" ] || { echo "::error::pin mismatch for $TEBAKO_SHIM_ASSET: Tebakofile=$TEBAKO_SHIM_SHA256 release=${got:-ABSENT}"; exit 1; }
          chmod +x .packager/tebako-shim
          echo "SHIM_BIN=$PWD/.packager/tebako-shim" >> "$GITHUB_ENV"
      # The image leg's universal image (the pair leg never rebuilds it —
      # one image, one digest).
      - name: Download the universal image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-universal
          path: out/image/
      - name: Pair the wrapper + run the smokes
        shell: bash
        env:
          ROLE: pair
          TRIPLET: ${{ matrix.platform.triplet }}
          ASSET_PLATFORM: ${{ matrix.platform.asset_platform }}
          TFS_CLI: .packager/tfs
          IMAGE_TARBALL: out/image
        # WRAPPER_BIN / SHIM_BIN flow through $GITHUB_ENV — process env,
        # not the static env: context.
        run: tools/build
      - name: Upload payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payload-${{ matrix.platform.triplet }}
          path: out/pair-${{ matrix.platform.triplet }}/
          retention-days: 7

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: [image, pair]
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The checkout rides the CI PAT so the registry bot branch's push
      # is the PAT's doing as well (tebako#686 — the publish step below).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.TEBAKO_CI_PAT_TOKEN }}
      - name: Collect payloads (all legs)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*"
          path: out/
          merge-multiple: false
      - name: Restore layout
        shell: bash
        run: |
          set -e
          for d in out/payload-*/; do
            p="${d#out/payload-}"; p="${p%/}"
            mkdir -p "out/pair-$p"
            mv "$d"* "out/pair-$p/"
            rmdir "$d"
          done
          # out/image-universal/ → out/image/
          mkdir -p out/image
          mv out/image-universal/* out/image/
          rmdir out/image-universal
      # The runtime release flow (spec 28 §6): the tag IS the tebako
      # product line (v<line>, the trr convention — the resolver's
      # {base}/v<tebako_version>/<asset> URL shape answers it). jruby has
      # ONE flavor on ONE line — a tag ships everything here.
      - name: Read the toolchain pins (Tebakofile is the SSOT)
        run: ruby tools/pins.rb macos-arm64 jvm --env >> "$GITHUB_ENV"
      - name: Create the release + upload the runtime pair assets
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          gh release create "$tag" --repo tamatebako/tebako-runtime-jruby \
            --title "$tag — tebako-runtime jruby (JRuby $PKG_VERSION, universal image on the java owner)" \
            --notes "tebako ruby:jruby runtime (spec 33 on_runtime): ONE universal env image + the per-triplet wrapper exe; manifest.json is the release index, SHA256SUMS.txt the trust anchor." \
            || gh release view "$tag" --repo tamatebako/tebako-runtime-jruby > /dev/null

          # Skip-if-current upload (tebako-runtime-ruby#189's wedge
          # lesson, proven by probe 2026-09-23): a DELETED asset name
          # 422-blocks re-uploads for hours, and bulk deletes wedge a
          # whole release. Payload names are byte-immutable per name: an
          # absent name uploads, a same-digest name skips, a
          # different-bytes name is KEPT loudly (the remedy is
          # `status: withdrawn` in the registry + the next patch line —
          # never a delete).
          asset_digest() { # $1=asset name → served sha256 or empty
            gh api "repos/tamatebako/tebako-runtime-jruby/releases/tags/$tag" \
              --jq ".assets[] | select(.name == \"$1\") | .digest" | sed 's/^sha256://'
          }
          upload_write_once() { # $1=local file
            local file="$1" name want have
            name="$(basename "$file")"
            want="$(shasum -a 256 "$file" | cut -d' ' -f1)"
            have="$(asset_digest "$name")"
            if [ -z "$have" ]; then
              gh release upload "$tag" --repo tamatebako/tebako-runtime-jruby "$file"
            elif [ "$have" = "$want" ]; then
              echo "$name is already current on the release — skipping"
            else
              echo "::warning::$name is already served with DIFFERENT bytes — keeping the served asset (byte-immutable per name; a bad asset's remedy is the registry's withdrawn mark + the next patch line)"
            fi
          }
          # The universal image + its sidecar (the image leg's artifact).
          upload_write_once "out/image/$RUNTIME_IMAGE_STEM.tfs"
          upload_write_once "out/image/$RUNTIME_IMAGE_STEM.tfs.sha256"
          # Per-triplet: the exe + sidecar + shard (never the sibling
          # payload-*.yaml).
          for shard in out/pair-*/tebako-runtime-*.manifest.json; do
            dir="$(dirname "$shard")"
            stem="$(basename "$shard" .manifest.json)"
            upload_write_once "$dir/$stem"
            upload_write_once "$dir/$stem.sha256"
            upload_write_once "$shard"
          done
      - name: Derive + upload the monoliths (manifest.json + SHA256SUMS.txt)
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          ruby -rjson -e 'puts JSON.pretty_generate(ARGV.sort.map { |f| JSON.parse(File.read(f)) })' \
            out/pair-*/tebako-runtime-*.manifest.json > manifest.json
          cat out/pair-*/tebako-runtime-*.sha256 "out/image/$RUNTIME_IMAGE_STEM.tfs.sha256" > SHA256SUMS.txt
          # The derived monoliths are metadata — pure functions of the
          # served shards — so a drifted one is debris and replaces (a
          # single-asset replace is the probe-proven safe case; the wedge
          # is the BULK delete). Already-current skips.
          for mono in manifest.json SHA256SUMS.txt; do
            want="$(shasum -a 256 "$mono" | cut -d' ' -f1)"
            have="$(gh api "repos/tamatebako/tebako-runtime-jruby/releases/tags/$tag" \
              --jq ".assets[] | select(.name == \"$mono\") | .digest" | sed 's/^sha256://')"
            if [ "$have" = "$want" ]; then
              echo "$mono is already current on the release — skipping"
            else
              gh release upload --clobber "$tag" --repo tamatebako/tebako-runtime-jruby "$mono"
            fi
          done
      # The registry mirrors resolution fields only (L3): the env image
      # is the named artifact per platform — the SAME universal asset
      # under every platform key (a consequence of the pinned universal
      # image); kind: runtime carries NO entrypoints key.
      - name: Render the registry entry
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          img_sha="$(cut -d' ' -f1 "out/image/$RUNTIME_IMAGE_STEM.tfs.sha256")"
          sed -e "s|@@VERSION@@|$PKG_VERSION|g" \
              -e "s|@@IMAGE_STEM@@|$RUNTIME_IMAGE_STEM|g" \
              -e "s|@@TAG@@|$tag|g" \
              -e "s|@@IMAGE_SHA256@@|$img_sha|g" \
              manifests/registry.yaml > tpkg-registry.yaml
      # main is branch-protected (and the GitHub-Actions bypass is not
      # available on this plan): the registry lands by bot PR + auto-merge,
      # never by direct push. Idempotent across re-runs of the same tag.
      # The PR is created AND merged under the CI PAT (tebako#686): a
      # GITHUB_TOKEN-authored PR never triggers pull_request workflows,
      # so its checks would sit pending forever and auto-merge would
      # never fire.
      - name: Publish the registry entry via pull request
        env:
          GH_TOKEN: ${{ secrets.TEBAKO_CI_PAT_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "tebako-ci"
          git config user.email "tebako@ribose.com"
          git fetch origin main
          # intent-to-add: git diff does not see UNTRACKED files — without
          # this the first-ever publish (main has no tpkg-registry.yaml yet)
          # silently reports "unchanged" and no registry PR opens (the
          # v2.5.0 publish, 2026-09-07).
          git add -N tpkg-registry.yaml
          if git diff --quiet origin/main -- tpkg-registry.yaml; then
            echo "registry unchanged (or the entry already landed on main)"
            exit 0
          fi
          branch="publish/${{ github.ref_name }}-registry"
          git checkout -b "$branch"
          git add tpkg-registry.yaml
          git commit -m "publish ${{ github.ref_name }}: registry entry"
          # force-with-lease on the bot branch: a re-publish re-creates it
          git push --force-with-lease origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "publish ${{ github.ref_name }}: registry entry" \
              --body "Automated registry entry for ${{ github.ref_name }} (the build-payload publish job; main is protected, so the registry lands by PR)."
          fi
          gh pr merge --auto --squash "$branch" || gh pr merge --squash "$branch"
